<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>The Family Tree — Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f1e3;
    --bg-deep: #ede4cc;
    --paper: #fdfaf3;          /* card interior — subtle warm off-white */
    --paper-pure: #ffffff;     /* chrome surfaces — solid white */
    --ink: #2a3326;
    --ink-soft: #6b7a63;
    --ink-faint: #97a08f;
    --line: #d8d0b8;
    --line-soft: #e8e1c8;
    --trunk: #5C3317;
    --trunk-dark: #3e2210;
    --wood: #8a5a36;
    --wood-light: #a06d44;
    --wood-shadow: #5C3317;
    --green-1: #2D7A2D;
    --green-2: #4CAF50;
    --green-3: #81C784;
    --green-4: #A5D6A7;
    --green-faint: #e7f2e5;
    --cream: #f5efdf;
    --cream-edge: #e7dfca;
    --sunset-1: #f6a96b;
    --sunset-2: #e6824a;
    --sunset-3: #b85a2a;
    --sunset-glow: #ffd9a8;
    --me: #b85a2a;          /* warm sunset accent for the logged-in user */
    --me-soft: #ffe4cc;
    --shadow-card: 0 2px 6px -2px rgba(60, 35, 15, 0.18), 0 8px 24px -12px rgba(60, 35, 15, 0.22);
    --shadow-card-hover: 0 4px 10px -3px rgba(60, 35, 15, 0.28), 0 14px 32px -10px rgba(60, 35, 15, 0.32);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    overscroll-behavior: none;
    /* Day / night sky cycle: dawn → day → sunset → night → dawn (matches v5) */
    background: linear-gradient(to bottom, #ffeed9 0%, #fff5e8 60%, #ffffff 100%);
    animation: skyCycle 36s linear infinite, textCycle 36s linear infinite;
  }

  @keyframes skyCycle {
    0%   { background: linear-gradient(to bottom, #ffcfa8 0%, #ffe8d0 40%, #fffaf0 100%); }   /* sunrise */
    14%  { background: linear-gradient(to bottom, #b7e0f2 0%, #e0f0fa 50%, #ffffff 100%); }   /* spring day */
    28%  { background: linear-gradient(to bottom, #aedcf0 0%, #ddeefa 50%, #ffffff 100%); }   /* summer */
    42%  { background: linear-gradient(to bottom, #b8c8d4 0%, #c8d4dc 50%, #d8e0e4 100%); }   /* rainy / monsoon */
    56%  { background: linear-gradient(to bottom, #f6a96b 0%, #ffcfa8 45%, #ffe6d0 100%); }   /* autumn sunset */
    70%  { background: linear-gradient(to bottom, #6a4e7a 0%, #3d3654 50%, #20243c 100%); }   /* dusk */
    84%  { background: linear-gradient(to bottom, #cfe0ec 0%, #e4ecf2 50%, #f4f7fa 100%); }   /* winter day */
    92%  { background: linear-gradient(to bottom, #1a2540 0%, #15203a 50%, #0e1830 100%); }   /* winter night */
    100% { background: linear-gradient(to bottom, #ffcfa8 0%, #ffe8d0 40%, #fffaf0 100%); }
  }

  /* Text color cycles with the sky so it stays legible against changing backgrounds */
  @keyframes textCycle {
    0%   { color: #3a2418; }
    28%  { color: #2a3326; }
    42%  { color: #2c3a44; }
    56%  { color: #3e2210; }
    70%  { color: #f0e4d6; }
    84%  { color: #2a3a48; }
    92%  { color: #f0e4d6; }
    100% { color: #3a2418; }
  }

  /* Subtle paper grain / aged warmth across the whole app */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse 60% 35% at 50% 0%,    rgba(246,169,107,0.10) 0%, rgba(246,169,107,0) 70%),
      radial-gradient(ellipse 50% 30% at 50% 100%,  rgba(92,51,23,0.08)    0%, rgba(92,51,23,0)    70%);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      radial-gradient(circle at 12% 22%, rgba(92,51,23,0.04) 0 1px, transparent 1.5px),
      radial-gradient(circle at 78% 64%, rgba(92,51,23,0.03) 0 1px, transparent 1.5px),
      radial-gradient(circle at 38% 88%, rgba(92,51,23,0.03) 0 1px, transparent 1.5px),
      radial-gradient(circle at 62% 12%, rgba(92,51,23,0.03) 0 1px, transparent 1.5px);
    background-size: 220px 220px, 280px 280px, 320px 320px, 260px 260px;
    opacity: 0.45;
  }

  /* =====================================================
     SKY LAYER — sun (arcs sunrise→noon→sunset), moon, stars
     ===================================================== */
  .sky-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sun {
    position: absolute;
    left: 0; top: 0;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle, #e6824a 0%, #e6824a 18%, #f6a96b 42%, #ffd9a8 72%, rgba(255,217,168,0) 100%);
    will-change: transform, opacity;
    animation: sunArc 36s linear infinite, sunVisibility 36s linear infinite;
  }
  /* Sun travels in an arc across the sky synced with skyCycle (matches v5) */
  @keyframes sunArc {
    0%   { transform: translate(-10vw, 75vh) scale(0.9); }   /* dawn, low left */
    14%  { transform: translate(33vw,  21vh) scale(1.0); }   /* morning */
    28%  { transform: translate(50vw,  15vh) scale(1.0); }   /* near noon */
    42%  { transform: translate(72vw,  21vh) scale(1.0); }
    56%  { transform: translate(110vw, 75vh) scale(1.1); }   /* sunset at horizon */
    62%  { transform: translate(115vw, 92vh) scale(1.1); }   /* dipped below */
    100% { transform: translate(-10vw, 75vh) scale(0.9); }
  }
  /* Sun is hidden once it dips below the horizon */
  @keyframes sunVisibility {
    0%   { opacity: 0.85; filter: saturate(1.3); }
    14%, 42% { opacity: 1; filter: saturate(0.9); }
    56%  { opacity: 1; filter: saturate(1.5); }   /* at horizon, glowing */
    60%  { opacity: 0; }                          /* below horizon: vanish */
    99%  { opacity: 0; }
    100% { opacity: 0.85; filter: saturate(1.3); }
  }

  /* Moon appears only at night */
  .moon {
    position: absolute;
    top: 12vh;
    right: 18vw;
    width: 56px; height: 56px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 38%, #fff5e0 0%, #f8efd0 55%, rgba(248,239,208,0) 100%);
    box-shadow: 0 0 28px rgba(255, 245, 224, 0.35);
    opacity: 0;
    animation: moonShow 36s ease-in-out infinite;
  }
  .moon::before, .moon::after {
    content: "";
    position: absolute;
    background: #e6dcb8;
    border-radius: 50%;
    opacity: 0.55;
  }
  .moon::before { width: 6px; height: 6px; top: 16px; left: 30px; }
  .moon::after  { width: 4px; height: 4px; top: 30px; left: 18px; }
  @keyframes moonShow {
    0%, 60%   { opacity: 0; transform: translateY(-20px); }
    72%       { opacity: 0.7; transform: translateY(0); }
    85%       { opacity: 1; transform: translateY(0); }
    95%       { opacity: 0.7; transform: translateY(0); }
    100%      { opacity: 0; transform: translateY(-20px); }
  }

  .stars {
    position: absolute; inset: 0;
    opacity: 0;
    animation: starsShow 36s ease-in-out infinite;
  }
  @keyframes starsShow {
    0%, 60%   { opacity: 0; }
    72%       { opacity: 0.6; }
    85%       { opacity: 1; }
    95%       { opacity: 0.6; }
    100%      { opacity: 0; }
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fffaf0;
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(255, 250, 240, 0.6);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  /* ============================================================
     CANVAS — full viewport, infinitely pannable
     ============================================================ */
  .canvas {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    background: transparent;
    touch-action: none;
    z-index: 2;
  }
  .canvas.dragging { cursor: grabbing; }
  .world {
    position: absolute;
    left: 50%;
    /* Origin shifted down so content sits well BELOW the top chrome.
       Top chrome is ~150px tall on desktop, ~130px on mobile; we add a
       generous buffer so panning up from "Me" doesn't bury ancestors. */
    top: calc(50% + 130px);
    width: 0;
    height: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  @media (max-width: 768px) {
    .world { top: calc(50% + 90px); }
  }
  .world.animating { transition: transform 600ms cubic-bezier(.65,.05,.36,1); }

  /* SVG layer underneath nodes for connector lines */
  .lines {
    position: absolute;
    left: -3000px;
    top: -2400px;
    width: 6000px;
    height: 4800px;
    pointer-events: none;
    overflow: visible;
  }
  .line {
    fill: none;
    stroke: #6b4222;
    stroke-width: 3.2;
    stroke-linecap: round;
    opacity: 0.7;
    transition: opacity .25s ease, stroke .25s ease, stroke-width .25s ease;
  }
  .line.dimmed { opacity: 0.12; }
  .line.highlighted {
    stroke: var(--green-1);
    stroke-width: 3.6;
    opacity: 1;
    filter: drop-shadow(0 0 4px rgba(45,122,45,0.45));
  }
  .line.spouse {
    stroke-dasharray: 5 5;
    stroke-width: 2;
    stroke: #8a5a36;
    opacity: 0.65;
  }
  .line.spouse.highlighted {
    stroke: var(--sunset-2);
    filter: drop-shadow(0 0 4px rgba(232,130,74,0.5));
  }
  .marriage-knot {
    fill: var(--wood);
    transition: fill .25s ease, transform .25s ease;
  }
  .marriage-knot.highlighted { fill: var(--sunset-2); }

  /* ============================================================
     NODE CARDS — hanging wooden frames
     ============================================================ */
  .node {
    position: absolute;
    width: 168px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    user-select: none;
    transition: opacity .3s ease, transform .35s cubic-bezier(.5,.1,.3,1.3);
    will-change: transform, opacity;
  }
  /* The little hanging string above each node */
  .node::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -18px;
    width: 1px;
    height: 18px;
    background: linear-gradient(to bottom, transparent 0%, rgba(122,90,50,0.4) 40%, rgba(122,90,50,0.7) 100%);
    transform: translateX(-0.5px);
  }
  .node::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 10px;
    height: 4px;
    border-radius: 1.5px;
    background: var(--trunk);
    transform: translateX(-50%);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .node-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 12px 12px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(92,51,23,0.12);
    /* Wood frame look */
    background-image:
      linear-gradient(to right, rgba(140,90,50,0.18) 0 8px, transparent 8px calc(100% - 8px), rgba(140,90,50,0.18) calc(100% - 8px) 100%),
      linear-gradient(to bottom, rgba(140,90,50,0.18) 0 8px, transparent 8px calc(100% - 8px), rgba(140,90,50,0.18) calc(100% - 8px) 100%);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .node:hover .node-card {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card-hover);
  }
  /* slight tilt for character — every other node tilts opposite */
  .node:nth-child(odd) .node-card { transform: rotate(-0.6deg); }
  .node:nth-child(even) .node-card { transform: rotate(0.6deg); }
  .node:hover:nth-child(odd) .node-card { transform: rotate(-0.6deg) translateY(-2px); }
  .node:hover:nth-child(even) .node-card { transform: rotate(0.6deg) translateY(-2px); }

  .node-thumb {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--green-4);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 20px;
    overflow: hidden;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(92,51,23,0.18), 0 2px 4px rgba(60,35,15,0.18);
    flex-shrink: 0;
  }
  .node-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .node-name {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-style: italic;
    font-size: 16px;
    line-height: 1.1;
    color: var(--ink);
    text-align: center;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  .node-rel {
    font-family: "Inter", sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.2;
  }

  /* Deceased indicator: small leaf in upper-right of card */
  .node.deceased .node-card::after {
    content: "";
    position: absolute;
    top: 5px;
    right: 5px;
    width: 12px;
    height: 12px;
    background: var(--green-1);
    clip-path: path("M6 0 C 11 3, 12 8, 6 12 C 0 8, 1 3, 6 0 Z");
    opacity: 0.85;
  }
  .node.deceased .node-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background: linear-gradient(to bottom, rgba(232,224,194,0.0) 0%, rgba(122,90,50,0.08) 100%);
    pointer-events: none;
  }
  .node.deceased .node-thumb { filter: saturate(0.7) brightness(0.97); }
  .node.deceased .node-name { font-style: italic; }

  /* Logged-in user — Me — gets a warm sunset glow & cord */
  .node.me .node-card {
    border-color: rgba(184,90,42,0.45);
    box-shadow:
      0 0 0 3px rgba(255,217,168,0.45),
      0 4px 10px -3px rgba(60,35,15,0.28),
      0 14px 32px -10px rgba(60,35,15,0.32);
    background-image:
      linear-gradient(to right, rgba(184,90,42,0.28) 0 8px, transparent 8px calc(100% - 8px), rgba(184,90,42,0.28) calc(100% - 8px) 100%),
      linear-gradient(to bottom, rgba(184,90,42,0.28) 0 8px, transparent 8px calc(100% - 8px), rgba(184,90,42,0.28) calc(100% - 8px) 100%);
  }
  .node.me .node-thumb {
    background: var(--sunset-2);
    box-shadow: 0 0 0 2px var(--me-soft), 0 0 0 3px rgba(184,90,42,0.45);
  }
  .node.me::before { background: linear-gradient(to bottom, transparent 0%, rgba(184,90,42,0.5) 40%, rgba(184,90,42,0.85) 100%); }
  .node.me::after  { background: var(--me); }
  .node.me .node-tag-me {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--me);
    color: #fff;
    font-family: "Inter", sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.22em;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(184,90,42,0.4);
  }

  /* Filter dim/highlight states */
  .node.dim {
    opacity: 0.28;
    filter: saturate(0.6);
  }
  .node.match {
    z-index: 2;
  }
  .node.match .node-card {
    box-shadow:
      0 0 0 2px var(--green-3),
      0 0 0 6px rgba(165,214,167,0.5),
      var(--shadow-card-hover);
  }
  .node.match:nth-child(odd) .node-card  { transform: rotate(-0.6deg) scale(1.06); }
  .node.match:nth-child(even) .node-card { transform: rotate(0.6deg)  scale(1.06); }

  .node.on-path .node-card {
    box-shadow:
      0 0 0 2px var(--green-1),
      0 0 0 7px rgba(45,122,45,0.22),
      var(--shadow-card-hover);
  }
  .node.endpoint .node-card {
    box-shadow:
      0 0 0 2px var(--sunset-2),
      0 0 0 8px rgba(232,130,74,0.28),
      var(--shadow-card-hover);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--sunset-2), 0 0 0 8px rgba(232,130,74,0.28), var(--shadow-card-hover); }
    50%      { box-shadow: 0 0 0 2px var(--sunset-2), 0 0 0 14px rgba(232,130,74,0.10), var(--shadow-card-hover); }
  }

  /* ============================================================
     TOP CHROME — wordmark, search, filter tags
     ============================================================ */
  .top-chrome {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    padding: 14px 24px 12px;
    background: #ffffff;
    border-bottom: 1px solid rgba(92,51,23,0.10);
    box-shadow: 0 2px 14px -4px rgba(60, 35, 15, 0.10);
  }

  .chrome-row {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 760px;
    margin: 0 auto;
  }
  .wordmark {
    display: flex;
    flex-direction: column;
    line-height: 1;
    flex-shrink: 0;
    margin-right: 6px;
    color: var(--ink);
    text-decoration: none;
    padding: 4px 0;
  }
  .wordmark:hover { text-decoration: none; }
  .wordmark .name { white-space: nowrap; }
  .wordmark .eyebrow {
    font-family: "Inter", sans-serif;
    font-size: 8.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .wordmark .name {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 19px;
    color: var(--ink);
    letter-spacing: 0.005em;
  }

  /* Search */
  .search-wrap {
    position: relative;
    flex: 1;
  }
  .search-input {
    width: 100%;
    height: 44px;
    padding: 0 14px 0 42px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 22px;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus {
    border-color: var(--green-1);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(45,122,45,0.10);
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 0;
    background: rgba(92,51,23,0.12);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.visible { display: flex; }
  .search-clear:hover { background: rgba(92,51,23,0.22); color: var(--ink); }

  .search-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 340px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 36px -8px rgba(60,35,15,0.20), 0 4px 12px rgba(60,35,15,0.08);
    display: none;
    z-index: 35;
  }
  .search-dropdown.open { display: block; }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    transition: background .12s ease;
  }
  .search-result:last-child { border-bottom: 0; }
  .search-result:hover, .search-result.active { background: var(--green-faint); }
  .sr-thumb {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--green-4); color: #fff;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600; font-size: 13px;
    overflow: hidden;
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(92,51,23,0.18);
  }
  .sr-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sr-meta {
    display: flex; flex-direction: column; line-height: 1.15;
    flex: 1; min-width: 0;
  }
  .sr-name {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }
  .sr-rel {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .sr-empty {
    padding: 18px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    font-family: "Cormorant Garamond", serif;
  }

  /* Profile chip on the right */
  .me-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 4px;
    background: #ffffff;
    border: 1px solid var(--line);

    cursor: pointer;
    flex-shrink: 0;

  .me-chip .mc-thumb {
    width: 32px; height: 32px; border-radius: 50%;

    display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600; font-size: 14px;
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(184,90,42,0.4);

  .me-chip .mc-name {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
  }

  /* Filter tags row */
  .tags-row {
    margin: 12px auto 0;
    max-width: 1000px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 20px 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  .tags-row::-webkit-scrollbar { display: none; }
  .tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;

    border: 1px solid var(--line);
    border-radius: 18px;
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);

  .tag:hover { background: #fdfaf3; border-color: rgba(92,51,23,0.28); }
  .tag.active {
    background: var(--green-1);
    color: #fff;
    border-color: var(--green-1);
    box-shadow: 0 4px 12px -2px rgba(45,122,45,0.45);

  .tag.disabled {

  .tag-count {

    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;

    border-radius: 9px;

    color: var(--ink-soft);
  }

  /* ============================================================
     ZOOM CONTROLS (bottom-right)
     ============================================================ */
  .zoom-ctrls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 20;

    flex-direction: column;
    gap: 4px;

    padding: 4px;
    box-shadow: 0 6px 20px rgba(60,35,15,0.10);

  .zoom-btn {
    width: 34px; height: 34px;
    border: 0;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;

  .zoom-btn:hover { background: rgba(92,51,23,0.10); }
  .zoom-btn svg { width: 16px; height: 16px; }

  /* Mini-map */
  .minimap {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 20;

    height: 120px;

  /* Status pill — top middle, shows active filter / selection breadcrumb */
  .status-pill {

  }
  .status-pill.visible { display: inline-flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  .status-pill.is-path { background: rgba(184,90,42,0.94); box-shadow: 0 6px 18px rgba(184,90,42,0.32); }
  .status-pill .breadcrumb {

  .status-pill .pill-close {

  }
  .status-pill .pill-close:hover { background: rgba(255,255,255,0.32); }

  /* ============================================================
     LIGHTBOX OVERLAY
     ============================================================ */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: stretch;
    justify-content: center;
    background: rgba(20,12,5,0.55);

  }
  @keyframes sheetIn {

  }
  .lb-close {
    position: absolute;
    top: 18px;
    right: 18px;

    border-radius: 50%;

    color: #fff;
    font-size: 18px;

  }
  .lb-close:hover { background: rgba(20,12,5,0.7); }

  /* Cover photo zone */
  .lb-cover {
    position: relative;
    height: 220px;
    background: linear-gradient(135deg, #ffd9a8 0%, #f6a96b 40%, #b85a2a 100%);
    overflow: hidden;
  }
  .lb-cover-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .lb-cover::after {
    content: "";

    inset: 0;
    background: linear-gradient(to bottom, rgba(20,12,5,0) 40%, rgba(251,246,231,0.5) 80%, var(--paper) 100%);
  }
  .lb-profile-photo {
    position: absolute;
    bottom: -56px;
    left: 50%;
    transform: translateX(-50%);
    width: 116px; height: 116px;
    border-radius: 50%;
    border: 4px solid var(--paper);
    background: var(--green-4);
    overflow: hidden;
    box-shadow: 0 8px 24px -6px rgba(20,12,5,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600; font-size: 38px;
    z-index: 2;
  }
  .lb-profile-photo img { width: 100%; height: 100%; object-fit: cover; }

  /* Profile header */
  .lb-header {
    padding: 72px 28px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line-soft);
  }
  .lb-name {
    font-family: "Cormorant Garamond", serif;

    font-style: italic;

  }
  .lb-name .leaf {

    height: 12px;
    margin-left: 8px;

  }
  .lb-rel {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--green-1);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .lb-rel.is-me { color: var(--me); }
  .lb-life {
    font-family: "Inter", sans-serif;

    letter-spacing: 0.06em;
  }
  .lb-life .sep {
    display: inline-block;

  .lb-bio {
    font-family: "Cormorant Garamond", serif;

    margin: 0 auto;
    text-wrap: pretty;
    font-style: italic;
  }
  .lb-bio::before, .lb-bio::after {
    content: "";
    display: inline-block;
    width: 30px; height: 1px;
    background: var(--green-1);
    vertical-align: middle;
    margin: 0 12px;

  /* Quick relations row inside lightbox */
  .lb-relations {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    padding: 16px 24px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .lb-rel-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 4px;
    background: rgba(165,214,167,0.18);
    border: 1px solid rgba(45,122,45,0.18);
    border-radius: 14px;
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .lb-rel-chip:hover {
    background: rgba(165,214,167,0.45);
    border-color: rgba(45,122,45,0.45);
  }
  .lb-rel-chip .lrc-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--green-3);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600; font-size: 10px;
    overflow: hidden;
  }
  .lb-rel-chip .lrc-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .lb-rel-chip .lrc-rel {
    color: var(--ink-soft);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-right: 4px;
  }

  /* Scrapbook timeline */
  .lb-timeline {
    padding: 26px 24px 36px;
  }
  .lb-timeline-title {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink);
    text-align: center;
    margin: 0 0 6px;
  }
  .lb-timeline-sub {
    text-align: center;
    font-family: "Inter", sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .lb-timeline-sub .sep {
    display: inline-block; width: 16px; height: 1px;
    background: var(--ink-soft); opacity: 0.5;
    vertical-align: middle; margin: 0 8px;
  }
  .lb-timeline-list {
    position: relative;
    padding-left: 28px;
  }
  .lb-timeline-list::before {
    content: "";
    position: absolute;
    left: 9px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: linear-gradient(to bottom, var(--green-3) 0%, var(--green-1) 50%, var(--wood) 100%);
    border-radius: 1px;
  }
  .scrap-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 14px 16px 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(60,35,15,0.06);
  }
  .scrap-card::before {
    content: "";
    position: absolute;
    left: -25px;
    top: 18px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--green-1);
  }
  .scrap-date {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green-1);
    margin-bottom: 8px;
  }
  .scrap-photos {
    display: grid;
    gap: 4px;
    margin-bottom: 10px;
    border-radius: 6px;
    overflow: hidden;
  }
  .scrap-photos.count-1 { grid-template-columns: 1fr; }
  .scrap-photos.count-2 { grid-template-columns: 1fr 1fr; }
  .scrap-photos.count-3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
  .scrap-photos.count-3 .scrap-photo:nth-child(1) { grid-row: span 2; }
  .scrap-photo {
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--cream), var(--cream-edge));
    border-radius: 4px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .scrap-photo svg { width: 38%; height: 38%; opacity: 0.4; }
  .scrap-photo.has-photo { background: #f7f1e3; }
  .scrap-photo img { width: 100%; height: 100%; object-fit: cover; }
  .scrap-caption {
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    text-wrap: pretty;
    font-style: italic;
    margin-bottom: 10px;
  }
  .scrap-tags {
    display: flex; flex-wrap: wrap; gap: 5px 6px;
    align-items: center;
  }
  .scrap-tags .label {
    font-family: "Inter", sans-serif;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 2px;
  }
  .scrap-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px 2px 3px;
    background: var(--green-faint);
    border: 1px solid rgba(45,122,45,0.18);
    border-radius: 12px;
    font-family: "Inter", sans-serif;
    font-size: 10.5px;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s ease;
  }
  .scrap-tag:hover { background: rgba(165,214,167,0.5); }
  .scrap-tag .st-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--green-3);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600; font-size: 9px;
    overflow: hidden;
  }
  .scrap-tag .st-thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* Empty timeline state */
  .scrap-empty {
    text-align: center;
    padding: 26px 12px;
    color: var(--ink-soft);
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 16px;
  }

  /* ============================================================
     MOBILE BOTTOM NAV — only on small screens
     ============================================================ */
  .mobile-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 28;
    display: none;
    background: #ffffff;
    border-top: 1px solid rgba(92,51,23,0.10);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(60,35,15,0.06);
  }
  .mnav-inner {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
  }
  .mnav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 8px;
    transition: color .15s ease, background .15s ease;
  }
  .mnav-btn svg { width: 20px; height: 20px; }
  .mnav-btn span {
    font-family: "Inter", sans-serif;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .mnav-btn.active { color: var(--green-1); }
  .mnav-btn:hover { background: rgba(92,51,23,0.06); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 768px) {
    .top-chrome { padding: 10px 12px 0; }
    .wordmark { display: none; }
    .me-chip .mc-name { display: none; }
    .me-chip { padding: 4px; }
    .tags-row { padding: 4px 12px 8px; }
    .tag { padding: 6px 11px; font-size: 11.5px; }
    .zoom-ctrls { bottom: 84px; right: 12px; }
    .minimap { display: none; }
    .mobile-nav { display: block; }
    .node { width: 138px; }
    .node-card { padding: 10px 8px 9px; gap: 4px; }
    .node-thumb { width: 44px; height: 44px; font-size: 17px; }
    .node-name { font-size: 14px; }
    .node-rel { font-size: 8px; }
    .lightbox {
      align-items: flex-end;
    }
    .lightbox-sheet {
      width: 100%;
      min-height: 90vh;
      border-radius: 18px 18px 0 0;
      margin-bottom: 0;
      animation: sheetUp .35s cubic-bezier(.5,.1,.3,1.2);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .lightbox::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 10vh;
      cursor: pointer;
    }
    .lb-cover { height: 180px; }
    .lb-profile-photo { width: 92px; height: 92px; font-size: 30px; bottom: -46px; }
    .lb-header { padding: 60px 20px 18px; }
    .lb-name { font-size: 28px; }
    .lb-bio { font-size: 15px; }
    .lb-bio::before, .lb-bio::after { width: 18px; margin: 0 8px; }

  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
    .world.animating { transition: none; }
  }
</style>

<body>

  <!-- ============================================================
       SKY LAYER — sun, moon, stars (day/night cycle, matches v5)
       ============================================================ -->
  <div class="sky-layer" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="sun"></div>
  </div>

  <!-- ============================================================
       TOP CHROME: wordmark + search + filter tags
       ============================================================ -->
  <div class="top-chrome">
    <div class="chrome-row">
      <a class="wordmark" href="The Family Tree v5.html" title="Sign-in screen">
        <span class="eyebrow">The Family Tree</span>
        <span class="name">where every leaf remembers</span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />

      <div class="me-chip" id="me-chip" title="Manisha Waghmare (you)">
        <div class="mc-thumb" id="me-chip-thumb">M</div>
        <span class="mc-name">Manisha</span>
      </div>
    </div>

    <div class="tags-row" id="tags-row"></div>
  </div>

  <!-- Status pill (shows active filter or selected path) -->
  <div class="status-pill" id="status-pill" role="status">
    <span class="breadcrumb" id="status-breadcrumb"></span>
    <button class="pill-close" id="status-close" aria-label="Clear">✕</button>
  </div>

  <!-- ============================================================
       CANVAS
       ============================================================ -->
  <div class="canvas" id="canvas">
    <div class="world" id="world">
      <svg class="lines" id="lines" viewBox="-3000 -2400 6000 4800" preserveAspectRatio="xMidYMid meet">
        <!-- connector lines injected by JS -->
      </svg>

    </div>
  </div>

  <!-- Zoom controls -->
  <div class="zoom-ctrls" aria-label="Zoom controls">
    <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="zoom-btn" id="zoom-fit" aria-label="Fit tree" title="Fit whole tree">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>
      </svg>
    </button>
    <button class="zoom-btn" id="zoom-me" aria-label="Center on me" title="Center on me">

        <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>
      </svg>
    </button>
  </div>

  <!-- Mini-map -->
  <div class="minimap" id="minimap">
    <canvas class="minimap-canvas" id="minimap-canvas" width="360" height="240"></canvas>
    <div class="minimap-viewport" id="minimap-viewport"></div>
  </div>

  <!-- ============================================================
       LIGHTBOX
       ============================================================ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-sheet" id="lightbox-sheet">
      <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
      <div class="lb-cover" id="lb-cover">
        <div class="lb-profile-photo" id="lb-profile-photo"></div>
      </div>
      <div class="lb-header">
        <div class="lb-rel" id="lb-rel">Relationship</div>
        <h2 class="lb-name" id="lb-name">Name</h2>
        <div class="lb-life" id="lb-life"></div>
        <p class="lb-bio" id="lb-bio"></p>
      </div>
      <div class="lb-relations" id="lb-relations"></div>
      <div class="lb-timeline">
        <h3 class="lb-timeline-title" id="lb-timeline-title">A Life in Pictures</h3>
        <div class="lb-timeline-sub">
          <span class="sep"></span>Scrapbook<span class="sep"></span>
        </div>
        <div class="lb-timeline-list" id="lb-timeline-list"></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       MOBILE BOTTOM NAV
       ============================================================ -->
  <nav class="mobile-nav" aria-label="Primary">

      <button class="mnav-btn" data-nav="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
      <button class="mnav-btn" data-nav="timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/>
        </svg>
        <span>Timeline</span>
      </button>
      <button class="mnav-btn" data-nav="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Profile</span>
      </button>
    </div>
  </nav>
