<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --bg: #ffffff;
                --ink: #2a3326;
                --ink-soft: #5a6a55;
                --line: #d8e0d2;
                --line-soft: #eef1ea;
                --trunk: #5C3317;
                --trunk-dark: #3e2210;
                --green-1: #2D7A2D;
                --green-2: #4CAF50;
                --green-3: #81C784;
                --green-4: #A5D6A7;
                --cream: #f5efdf;
                --cream-edge: #e7dfca;
                --wood: #8a5a36;
                --wood-dark: #5C3317;
                --silhouette: #2c1a10;
                --sunset-1: #f6a96b;
                --sunset-2: #e6824a;
                --sunset-3: #b85a2a;
                --sunset-glow: #ffd9a8;
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                background: linear-gradient(to bottom, #ffeed9 0%, #fff5e8 60%, #ffffff 100%);
                color: var(--ink);
                font-family: "Inter", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
                animation: skyCycle 36s linear infinite, textCycle 36s linear infinite;
            }

            /* Day / night sky cycle: dawn → day → sunset → night → dawn */
            @keyframes skyCycle {
                0% {
                    background: linear-gradient(to bottom, #ffcfa8 0%, #ffe8d0 40%, #fffaf0 100%);
                }
                14% {
                    background: linear-gradient(to bottom, #b7e0f2 0%, #e0f0fa 50%, #ffffff 100%);
                }
                28% {
                    background: linear-gradient(to bottom, #aedcf0 0%, #ddeefa 50%, #ffffff 100%);
                }
                42% {
                    background: linear-gradient(to bottom, #b8c8d4 0%, #c8d4dc 50%, #d8e0e4 100%);
                }
                56% {
                    background: linear-gradient(to bottom, #f6a96b 0%, #ffcfa8 45%, #ffe6d0 100%);
                }
                70% {
                    background: linear-gradient(to bottom, #6a4e7a 0%, #3d3654 50%, #20243c 100%);
                }
                84% {
                    background: linear-gradient(to bottom, #cfe0ec 0%, #e4ecf2 50%, #f4f7fa 100%);
                }
                92% {
                    background: linear-gradient(to bottom, #1a2540 0%, #15203a 50%, #0e1830 100%);
                }
                100% {
                    background: linear-gradient(to bottom, #ffcfa8 0%, #ffe8d0 40%, #fffaf0 100%);
                }
            }

            @keyframes textCycle {
                0% { color: #3a2418; }
                28% { color: #2a3326; }
                42% { color: #2c3a44; }
                56% { color: #3e2210; }
                70% { color: #f0e4d6; }
                84% { color: #2a3a48; }
                92% { color: #f0e4d6; }
                100% { color: #3a2418; }
            }

            .staticrypt-content {
                max-width: 460px;
                margin: 0 auto;
                padding: 28px 22px 56px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            /* ---------- Wordmark ---------- */
            .login-wordmark {
                text-align: center;
                margin-bottom: 4px;
                opacity: 0;
                animation: fadeIn 1.2s ease-out 0.2s forwards;
            }

            .login-wordmark .eyebrow {
                font-family: "Inter", sans-serif;
                font-size: 10px;
                letter-spacing: 0.38em;
                text-transform: uppercase;
                color: var(--ink-soft);
                margin-bottom: 6px;
            }

            .login-wordmark h1 {
                font-family: "Cormorant Garamond", serif;
                font-weight: 500;
                font-style: italic;
                font-size: 30px;
                letter-spacing: 0.01em;
                color: var(--ink);
                margin: 0;
            }

            /* ---------- Tree stage ---------- */
            .stage {
                position: relative;
                width: 100%;
                aspect-ratio: 1 / 1;
                margin-top: 4px;
            }

            .stage svg.tree {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                overflow: visible;
            }

            /* Mother photo placed via foreignObject in SVG */
            .center-frame-photo {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            /* Sway groups */
            .sway {
                transform-box: fill-box;
                transform-origin: 50% 100%;
            }

            .sway-a {
                animation: swayA 5.2s ease-in-out infinite;
            }

            .sway-b {
                animation: swayB 4.6s ease-in-out infinite;
                animation-delay: -0.7s;
            }

            .sway-c {
                animation: swayC 5.8s ease-in-out infinite;
                animation-delay: -1.4s;
            }

            @keyframes swayA {
                0%, 100% { transform: rotate(-1.2deg) translateY(0); }
                50% { transform: rotate(1.4deg) translateY(-1px); }
            }

            @keyframes swayB {
                0%, 100% { transform: rotate(1.1deg) translateY(0); }
                50% { transform: rotate(-1.3deg) translateY(-1.2px); }
            }

            @keyframes swayC {
                0%, 100% { transform: rotate(-0.9deg) translateY(0); }
                50% { transform: rotate(1.0deg) translateY(-0.8px); }
            }

            /* Frames hang with a gentle sway */
            .hang {
                transform-box: fill-box;
                transform-origin: 50% 0%;
            }

            .hang-1 {
                animation: hangA 4.8s ease-in-out infinite;
            }

            .hang-2 {
                animation: hangB 5.4s ease-in-out infinite;
                animation-delay: -0.6s;
            }

            .hang-3 {
                animation: hangA 5.0s ease-in-out infinite;
                animation-delay: -1.2s;
            }

            .hang-4 {
                animation: hangB 4.4s ease-in-out infinite;
                animation-delay: -0.9s;
            }

            @keyframes hangA {
                0%, 100% { transform: rotate(-1.4deg); }
                50% { transform: rotate(1.2deg); }
            }

            @keyframes hangB {
                0%, 100% { transform: rotate(1.2deg); }
                50% { transform: rotate(-1.4deg); }
            }

            /* Center frame glow */
            .center-frame-glow {
                transform-box: fill-box;
                transform-origin: 50% 50%;
                animation: breathe 3.6s ease-in-out infinite;
            }

            @keyframes breathe {
                0%, 100% { opacity: 0.35; transform: scale(1); }
                50% { opacity: 0.85; transform: scale(1.06); }
            }

            /* ---------- Dedication ---------- */
            .dedication {
                text-align: center;
                margin-top: 6px;
                padding: 0 14px;
                opacity: 0;
                animation: fadeIn 1.6s ease-out 1.0s forwards;
            }

            .rule {
                width: 38px;
                height: 1px;
                background: var(--green-1);
                margin: 0 auto 14px;
                opacity: 0.55;
            }

            .dedication .line-1 {
                font-family: "Cormorant Garamond", serif;
                font-style: italic;
                font-weight: 500;
                font-size: 21px;
                line-height: 1.35;
                color: #2a3326;
                margin: 0 0 8px;
                letter-spacing: 0.005em;
            }

            .dedication .line-1 .accent {
                color: var(--green-1);
                font-weight: 600;
            }

            .dedication .line-2 {
                font-family: "Inter", sans-serif;
                font-size: 11.5px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--ink-soft);
                margin: 0;
            }

            .dedication .line-2 .sep {
                display: inline-block;
                width: 6px;
                height: 1px;
                background: var(--ink-soft);
                vertical-align: middle;
                margin: 0 8px;
                opacity: 0.6;
            }

            /* ---------- Login form ---------- */
            .staticrypt-page {
                margin-top: 28px;
                opacity: 0;
                animation: fadeIn 1.2s ease-out 1.6s forwards;
            }

            .staticrypt-form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .field {
                position: relative;
                width: 100%;
            }

            .field label {
                position: absolute;
                left: 14px;
                top: 9px;
                font-size: 10px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-soft);
                pointer-events: none;
                z-index: 5;
            }

            .field input[type="text"],
            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                width: 100%;
                padding: 26px 14px 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #fff;
                font-family: "Inter", sans-serif;
                font-size: 15px;
                color: var(--ink);
                transition: border-color .18s ease, box-shadow .18s ease;
                -webkit-appearance: none;
                outline: none;
            }

            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                padding-right: 48px; /* space for password toggle eye */
            }

            .field input:hover,
            .staticrypt-password-container input:hover {
                border-color: #c8d2c0;
            }

            .field input:focus,
            .staticrypt-password-container input:focus {
                border-color: var(--green-1);
                box-shadow: 0 0 0 4px rgba(45, 122, 45, 0.10);
            }

            /* DOB input container layout */
            .dob-container {
                display: flex;
                gap: 8px;
                align-items: center;
                position: relative;
            }

            .dob-container input[type="text"] {
                flex: 1;
            }

            .dob-container input[type="date"] {
                position: absolute;
                opacity: 0;
                width: 40px;
                height: 40px;
                right: 0;
                top: 0;
                cursor: pointer;
                z-index: 10;
            }

            .calendar-icon {
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--line-soft);
                border-radius: 10px;
                color: var(--ink-soft);
                position: relative;
            }

            .calendar-icon svg {
                width: 20px;
                height: 20px;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 40%;
                padding: 12px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                transition: opacity 0.2s;
                z-index: 10;
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 70%;
            }

            .row-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 2px 2px 4px;
                font-size: 12.5px;
            }

            .remember {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                color: var(--ink-soft);
                cursor: pointer;
                user-select: none;
            }

            .remember input[type="checkbox"] {
                accent-color: var(--green-1);
                transform: scale(1.1);
                margin: 0;
            }

            .staticrypt-decrypt-button {
                margin-top: 4px;
                width: 100%;
                padding: 15px 16px;
                background: var(--green-1);
                color: #fff;
                border: 0;
                border-radius: 10px;
                font-family: "Inter", sans-serif;
                font-weight: 600;
                font-size: 14.5px;
                letter-spacing: 0.06em;
                cursor: pointer;
                transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
                box-shadow: 0 6px 18px -8px rgba(45, 122, 45, 0.55);
            }

            .staticrypt-decrypt-button:hover {
                background: #266a26;
            }

            .staticrypt-decrypt-button:active {
                transform: translateY(1px);
            }

            /* Sky animations & transitions */
            .sun {
                transform-box: fill-box;
                transform-origin: 50% 50%;
                animation: sunArc 36s linear infinite, sunVisibility 36s linear infinite;
            }

            @keyframes sunArc {
                0% { transform: translate(-220px, 460px) scale(0.9); }
                14% { transform: translate(-60px, -200px) scale(1.0); }
                28% { transform: translate(0px, -260px) scale(1.0); }
                42% { transform: translate(80px, -200px) scale(1.0); }
                56% { transform: translate(220px, 460px) scale(1.1); }
                62% { transform: translate(240px, 520px) scale(1.1); }
                100% { transform: translate(-220px, 460px) scale(0.9); }
            }

            @keyframes sunVisibility {
                0% { opacity: 0.85; filter: saturate(1.3); }
                14%, 42% { opacity: 1; filter: saturate(0.9); }
                56% { opacity: 1; filter: saturate(1.5); }
                60% { opacity: 0; }
                99% { opacity: 0; }
                100% { opacity: 0.85; filter: saturate(1.3); }
            }

            .moon {
                animation: moonShow 32s ease-in-out infinite;
                opacity: 0;
            }

            @keyframes moonShow {
                0%, 60% { opacity: 0; transform: translateY(-20px); }
                72% { opacity: 0.7; transform: translateY(0); }
                85% { opacity: 1; transform: translateY(0); }
                95% { opacity: 0.7; transform: translateY(0); }
                100% { opacity: 0; transform: translateY(-20px); }
            }

            .star {
                animation: twinkle 3s ease-in-out infinite;
                opacity: 0;
            }

            .stars {
                animation: starsShow 32s ease-in-out infinite;
                opacity: 0;
            }

            @keyframes starsShow {
                0%, 60% { opacity: 0; }
                72% { opacity: 0.6; }
                85% { opacity: 1; }
                95% { opacity: 0.6; }
                100% { opacity: 0; }
            }

            @keyframes twinkle {
                0%, 100% { opacity: 0.35; }
                50% { opacity: 1; }
            }

            .canopy-seasons {
                animation: seasonCycle 32s ease-in-out infinite;
            }

            @keyframes seasonCycle {
                0% { filter: hue-rotate(0deg) saturate(1) brightness(1); }
                18% { filter: hue-rotate(-8deg) saturate(1.15) brightness(1.02); }
                38% { filter: hue-rotate(-5deg) saturate(1.1) brightness(1); }
                55% { filter: hue-rotate(50deg) saturate(0.85) brightness(0.95); }
                72% { filter: hue-rotate(20deg) saturate(0.5) brightness(0.75); }
                85% { filter: hue-rotate(0deg) saturate(0.3) brightness(0.45); }
                100% { filter: hue-rotate(0deg) saturate(1) brightness(1); }
            }

            .cloud-1 { animation: drift1 42s linear infinite; }
            .cloud-2 { animation: drift2 56s linear infinite; }
            .cloud-3 { animation: drift1 64s linear infinite; animation-delay: -22s; }

            @keyframes drift1 {
                0% { transform: translateX(-80px); }
                100% { transform: translateX(700px); }
            }

            @keyframes drift2 {
                0% { transform: translateX(680px); }
                100% { transform: translateX(-120px); }
            }

            /* Birds and flying animations */
            .bird-flock-1 {
                animation: flyFlock1 28s linear infinite;
            }
            .bird-flock-2 {
                animation: flyFlock2 34s linear infinite;
                animation-delay: -10s;
            }
            .bird-wing-a { animation: flapWing 0.4s ease-in-out infinite alternate; transform-origin: 10px 0; }
            .bird-wing-b { animation: flapWing 0.35s ease-in-out infinite alternate; transform-origin: 8px 0; }
            .bird-wing-c { animation: flapWing 0.45s ease-in-out infinite alternate; transform-origin: 8px 0; }

            @keyframes flapWing {
                from { transform: scaleY(1); }
                to { transform: scaleY(-0.8); }
            }

            @keyframes flyFlock1 {
                0% { transform: translate(-100px, 120px) scale(0.6); }
                100% { transform: translate(700px, 40px) scale(0.6); }
            }

            @keyframes flyFlock2 {
                0% { transform: translate(-100px, 80px) scale(0.45); }
                100% { transform: translate(700px, 140px) scale(0.45); }
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2.5rem;
                height: 2.5rem;
                border: 0.25em solid var(--green-3);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-dummy {
                color: /*[|template_color_primary|]*/ 0;
                background: /*[|template_color_secondary|]*/ 0;
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <!-- Header (Wordmark) -->
            <header class="login-wordmark">
                <div class="eyebrow">The Family Tree</div>
                <h1>where every leaf remembers</h1>
            </header>

            <!-- Tree SVG Stage -->
            <section class="stage" aria-hidden="true">
                <svg class="tree" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Wood frame gradient -->
                        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#a06d44" />
                            <stop offset="55%" stop-color="#7a4a28" />
                            <stop offset="100%" stop-color="#5C3317" />
                        </linearGradient>
                        <linearGradient id="woodH" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#6b3f22" />
                            <stop offset="50%" stop-color="#8a5a36" />
                            <stop offset="100%" stop-color="#6b3f22" />
                        </linearGradient>

                        <!-- Trunk gradient for soft form -->
                        <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#4a2912" />
                            <stop offset="50%" stop-color="#5C3317" />
                            <stop offset="100%" stop-color="#3e2210" />
                        </linearGradient>

                        <!-- Sunset wash radial behind the tree -->
                        <radialGradient id="sunsetWash" cx="0.5" cy="0.45" r="0.55">
                            <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.55" />
                            <stop offset="45%" stop-color="#f6a96b" stop-opacity="0.28" />
                            <stop offset="100%" stop-color="#f6a96b" stop-opacity="0" />
                        </radialGradient>

                        <!-- Leaf shape symbol -->
                        <symbol id="leafShape" viewBox="-10 -16 20 32" overflow="visible">
                            <path d="M0 -16 C 8 -10, 9 4, 0 16 C -9 4, -8 -10, 0 -16 Z" />
                            <path d="M0 -14 L 0 14" stroke="rgba(0,0,0,0.18)" stroke-width="0.8" fill="none" />
                        </symbol>

                        <!-- Soft green halo for center frame -->
                        <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
                            <stop offset="0%" stop-color="#A5D6A7" stop-opacity="0.85" />
                            <stop offset="55%" stop-color="#81C784" stop-opacity="0.35" />
                            <stop offset="100%" stop-color="#81C784" stop-opacity="0" />
                        </radialGradient>

                        <!-- Ground shadow -->
                        <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
                            <stop offset="0%" stop-color="#5C3317" stop-opacity="0.22" />
                            <stop offset="100%" stop-color="#5C3317" stop-opacity="0" />
                        </radialGradient>

                        <!-- Leaf symbol used inside empty frames -->
                        <symbol id="leafIcon" viewBox="0 0 24 24">
                            <path d="M12 2 C 18 6, 20 12, 12 22 C 4 12, 6 6, 12 2 Z" fill="#81C784" />
                            <path d="M12 4 L12 20" stroke="#2D7A2D" stroke-width="0.9" stroke-linecap="round" fill="none" />
                        </symbol>
                    </defs>

                    <!-- ===== ANIMATED SUN ===== -->
                    <g class="sun">
                        <circle cx="300" cy="460" r="48" fill="#ffd9a8" opacity="0.6" />
                        <circle cx="300" cy="460" r="32" fill="#f6a96b" opacity="0.92" />
                        <circle cx="300" cy="460" r="20" fill="#e6824a" />
                    </g>

                    <!-- ===== SKY: animated sun + drifting clouds + moon/stars ===== -->
                    <g id="sky">
                        <!-- Stars -->
                        <g class="stars" fill="#fffaf0">
                            <circle class="star" cx="60" cy="50" r="1.4" style="animation-delay: -0.4s;" />
                            <circle class="star" cx="110" cy="30" r="1.2" style="animation-delay: -1.1s;" />
                            <circle class="star" cx="180" cy="60" r="1.5" style="animation-delay: -2.0s;" />
                            <circle class="star" cx="260" cy="40" r="1.2" style="animation-delay: -0.7s;" />
                            <circle class="star" cx="340" cy="30" r="1.4" style="animation-delay: -1.4s;" />
                            <circle class="star" cx="420" cy="55" r="1.3" style="animation-delay: -2.6s;" />
                            <circle class="star" cx="500" cy="35" r="1.5" style="animation-delay: -1.7s;" />
                            <circle class="star" cx="560" cy="60" r="1.3" style="animation-delay: -0.3s;" />
                            <circle class="star" cx="30" cy="100" r="1.2" style="animation-delay: -2.2s;" />
                            <circle class="star" cx="570" cy="110" r="1.2" style="animation-delay: -1.5s;" />
                            <circle class="star" cx="150" cy="120" r="1.1" style="animation-delay: -0.9s;" />
                            <circle class="star" cx="450" cy="125" r="1.1" style="animation-delay: -1.9s;" />
                        </g>
                        <!-- Moon -->
                        <g class="moon" transform="translate(420 90)">
                            <circle cx="0" cy="0" r="22" fill="#fff5e0" opacity="0.4" />
                            <circle cx="0" cy="0" r="14" fill="#f8efd0" />
                            <circle cx="4" cy="-3" r="2" fill="#e6dcb8" opacity="0.6" />
                            <circle cx="-3" cy="4" r="1.5" fill="#e6dcb8" opacity="0.55" />
                            <circle cx="-5" cy="-2" r="1.2" fill="#e6dcb8" opacity="0.5" />
                        </g>
                        <!-- Clouds -->
                        <g class="cloud-1" opacity="0.85">

        <script>
            // helper function to format date input
            function formatDOB(input) {
                let val = input.value.replace(/\D/g, '');
                if (val.length > 2) val = val.slice(0, 2) + '/' + val.slice(2);
                if (val.length > 5) val = val.slice(0, 5) + '/' + val.slice(5, 9);
                input.value = val;
            }

            // Sync native date picker to the text field
            function syncDate(input) {
                if (!input.value) return;
                const parts = input.value.split('-'); // yyyy-mm-dd
                if (parts.length === 3) {
                    document.getElementById('staticrypt-dob').value = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
            }

            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            // you can edit these values to customize some of the behavior of StatiCrypt
            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: function(plainHTML) {
                    // Nothing is copied into storage here. This used to mirror the
                    // passphrase into sessionStorage and set an ft_session cookie that
                    // nothing ever read — both are gone; the page decrypts and forgets.
                    document.open();
                    document.write(plainHTML);
                    document.close();
                },
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine. rememberDurationInDays is deliberately NOT set:
            // the build passes --remember 0, and a hardcoded 30 here used to override that
            // flag entirely, which is why the gate stopped asking for the password at all.
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                // The password must be typed on every visit, so purge anything a previous
                // build left behind — without this, a 30-day key already sitting in a
                // family member's browser would keep letting them straight in.
                try {
                    localStorage.removeItem("staticrypt_passphrase");
                    localStorage.removeItem("staticrypt_expiration");
                    sessionStorage.removeItem("staticrypt_passphrase");
                    sessionStorage.removeItem("staticrypt_expiration");
                } catch (e) { /* storage blocked entirely — nothing to purge */ }

                // Always false now that nothing is stored, but it also clears the loading
                // screen and shows the form, so the call stays.
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-fullname").focus();
                }
            };

            // toggle password visibility

            const imgSrcEyeOpened =

            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const name = document.getElementById("staticrypt-fullname").value.trim(),
                    dob = document.getElementById("staticrypt-dob").value.trim(),
                    password = document.getElementById("staticrypt-password").value;

                // Name and DOB cross the document.write into the inner app's own identity
                // check. They are not the family password and are cleared below on failure.
                sessionStorage.setItem("staticrypt_pending_name", name);
                sessionStorage.setItem("staticrypt_pending_dob", dob);

                // false = never remember. This is the call that used to write the
                // passphrase to localStorage.
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, false);

                if (!isSuccessful) {
                    alert(templateError);
                    // Clear the session details if decryption failed
                    sessionStorage.removeItem("staticrypt_pending_name");
                    sessionStorage.removeItem("staticrypt_pending_dob");
                }
            });
        </script>
