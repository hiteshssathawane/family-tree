name: Sync Google Sheets Data

on:
  repository_dispatch:
    types: [sync-sheet]
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Every Form submission fires its own repository_dispatch. During the 64-row bulk load on
# 2026-08-29 that started 21 runs inside three minutes, which all raced on `git push` and
# lost — 21 "all jobs have failed" emails for a load that had actually succeeded. The pull
# is a full snapshot of the sheet, not an increment, so an in-flight run is always
# redundant once a newer submission has arrived: cancel it and let the last one win.
concurrency:
  group: sync-sheet
  cancel-in-progress: true

permissions:
  contents: write
  # The sync commit carries [skip ci], so the push cannot start deploy.yml on its own and
  # the last step dispatches it explicitly. `gh workflow run` needs actions: write to do
  # that — without it the dispatch fails 403 after the data has already been committed.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Offline guard: date-timezone handling, required-column reconciliation and
      # spouse-gender inference. Fails before touching the sheet if any regressed.
      - name: Verify Pipeline Logic
        run: npm run verify:pipeline

      - name: Pull Sheet Data
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_SECRET: ${{ secrets.GOOGLE_SHEET_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
        run: |
          npm run sheet:pull
          npm run media:sync

      - name: Commit and Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/family.json data/auth.json data/form-responses.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: auto-sync data from Google Sheets [skip ci]"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Deploy Workflow
        if: steps.commit_step.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
